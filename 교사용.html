

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진로상담 관리자</title>
<style>
body{margin:0;background:#f5f7fb;font-family:Arial,"Noto Sans KR",sans-serif;color:#202938}.wrap{max-width:1250px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0000000d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#f7f8fc;padding:16px;border-radius:12px}.stat b{display:block;font-size:28px;margin-top:5px}select,input{padding:10px;border:1px solid #d9deea;border-radius:9px}button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700}.blue{background:#4657d8;color:#fff}.gray{background:#edf0f6}.red{background:#fff0f0;color:#a52222}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid #edf0f5;text-align:left;font-size:14px}th{background:#fafbfc;color:#667085}.badge{padding:5px 8px;border-radius:20px;font-size:12px;font-weight:700}.wait{background:#fff4d6}.ok{background:#e7f7ed}.done{background:#e9eefb}.cancel{background:#eee}.filters{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.wrap{padding:12px}table{min-width:950px}} 
</style></head><body><div class="wrap"><div class="head"><div><h1>📊 진로상담 관리자</h1><div>교사 PC용 상담 신청 관리</div></div><button class="blue" onclick="load()">새로고침</button></div>
<div class="stats"><div class="stat">전체<b id="total">0</b></div><div class="stat">신청<b id="waiting">0</b></div><div class="stat">승인<b id="approved">0</b></div><div class="stat">완료<b id="done">0</b></div></div>
<div class="card"><div class="filters"><select id="sf" onchange="render()"><option>전체</option><option>신청</option><option>승인</option><option>상담 완료</option><option>취소</option></select><select id="cf" onchange="render()"><option>전체</option><option>진학</option><option>취업</option><option>진로탐색</option><option>학과·전공</option><option>대학입시</option><option>자격증</option><option>진로미결정</option><option>기타</option></select><input id="q" placeholder="학생 이름 검색" oninput="render()"></div></div>
<div class="card"><div style="overflow:auto"><table><thead><tr><th>상담일시</th><th>학생</th><th>분야</th><th>방법</th><th>상담내용</th><th>상태</th><th>관리</th></tr></thead><tbody id="body"></tbody></table></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycby2ppaBbYDzvf4yNU4zRy1Jiql0p-K90U_ymY2A360RsU5Og2uiixpdk-rNkuh8EKTCvQ/exec";let data=[];
async function api(action,payload={}){if(API_URL.startsWith("YOUR_"))throw new Error("관리자 설정이 필요합니다.");let r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...payload})});return r.json();}
async function load(){try{let r=await api("list");if(!r.ok)throw Error(r.message);data=r.items;render()}catch(e){alert(e.message)}}
function render(){let s=sf.value,c=cf.value,q=document.getElementById("q").value.trim();let rows=data.filter(x=>(s==="전체"||x.status===s)&&(c==="전체"||x.category===c)&&(!q||x.name.includes(q)));total.textContent=data.length;waiting.textContent=data.filter(x=>x.status==="신청").length;approved.textContent=data.filter(x=>x.status==="승인").length;done.textContent=data.filter(x=>x.status==="상담 완료").length;body.innerHTML=rows.map(x=>`<tr><td>${x.date}<br>${x.time}</td><td>${x.name}<br>${x.grade} ${x.cls}반 ${x.no}번</td><td>${x.category}</td><td>${x.method}</td><td>${x.memo}</td><td><span class="badge ${x.status==='신청'?'wait':x.status==='승인'?'ok':x.status==='상담 완료'?'done':'cancel'}">${x.status}</span></td><td>${x.status==='신청'?`<button class="blue" onclick="status('${x.id}','승인')">승인</button>`:''} ${x.status==='승인'?`<button class="gray" onclick="status('${x.id}','상담 완료')">완료</button>`:''} ${x.status!=='상담 완료'&&x.status!=='취소'?`<button class="red" onclick="status('${x.id}','취소')">취소</button>`:''}</td></tr>`).join("")||'<tr><td colspan="7" style="text-align:center;padding:30px">신청 내역이 없습니다.</td></tr>'}
async function status(id,statusValue){if(!confirm("상태를 '"+statusValue+"'로 변경할까요?"))return;try{let r=await api("status",{id,status:statusValue});if(!r.ok)throw Error(r.message);await load()}catch(e){alert(e.message)}}
load();
</script></body></html>
