<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진로상담 신청</title>
<style>
body{margin:0;background:#f5f7fb;font-family:Arial,"Noto Sans KR",sans-serif;color:#202938}.wrap{max-width:600px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 5px 20px #0000000d}h1{font-size:22px;margin:0 0 16px}.form-group{margin-bottom:16px}label{display:block;font-size:14px;font-weight:700;margin-bottom:6px;color:#4b5563}input,select,textarea{width:100%;padding:12px;border:1px solid #d9deea;border-radius:10px;box-sizing:border-box;font-size:14px}textarea{height:80px;resize:none}button{width:100%;padding:14px;border:0;border-radius:10px;background:#4657d8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.msg{padding:12px;border-radius:10px;margin-top:12px;font-size:14px}.success{background:#e7f7ed;color:#0d6e36}.error{background:#fff0f0;color:#a52222}.item{border-bottom:1px solid #edf0f5;padding:12px 0}.item:last-child{border:0}.badge{padding:4px 8px;border-radius:6px;font-size:12px;font-weight:700}.wait{background:#fff4d6;color:#8a6d3b}.ok{background:#e7f7ed;color:#0d6e36}.done{background:#e9eefb;color:#2b4380}.cancel{background:#eee;color:#666}
</style></head><body><div class="wrap">
<div class="card"><h1>📝 진로상담 신청</h1>
<form id="applyForm">
<div class="grid-3" style="margin-bottom:16px">
<div><label>학년</label><select id="grade" required><option value="1학년">1학년</option><option value="2학년">2학년</option><option value="3학년">3학년</option></select></div>
<div><label>반</label><input id="cls" placeholder="예: 1반" required></div>
<div><label>번호</label><input id="no" placeholder="예: 1번" required></div>
</div>
<div class="form-group"><label>이름</label><input id="name" placeholder="성함 입력" required></div>
<div class="grid-2" style="margin-bottom:16px">
<div><label>상담 날짜</label><input type="date" id="date" required></div>
<div><label>상담 시간</label><input type="time" id="time" required></div>
</div>
<div class="grid-2" style="margin-bottom:16px">
<div><label>상담 분야</label><select id="category"><option>진학</option><option>취업</option><option>진로탐색</option><option>학과·전공</option><option>대학입시</option><option>자격증</option><option>진로미결정</option><option>기타</option></select></div>
<div><label>상담 방법</label><select id="method"><option>대면</option><option>비대면</option></select></div>
</div>
<div class="form-group"><label>상담 내용</label><textarea id="memo" placeholder="상담받고 싶은 내용을 적어주세요."></textarea></div>
<button type="submit">상담 신청하기</button>
<div id="applyMsg"></div>
</form>
</div>

<div class="card"><h1>🔍 신청 내역 확인</h1>
<p style="font-size:13px;color:#666;margin-top:-10px">이름과 학번을 입력하면 본인의 상담 신청 상태를 확인 할 수 있습니다.<br>학번 입력 예시: 1학년 01반 01번 → 10101</p>
<div class="grid-2" style="margin-bottom:12px">
<input id="searchName" placeholder="이름 (예: 가나다)">
<input id="searchCode" placeholder="학번 5자리 (예: 10101)">
</div>
<button onclick="checkStatus()">내 신청 확인</button>
<div id="statusResult" style="margin-top:16px"></div>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbz18spt4Jiv6Ynn1DZy_-N1Upmu-ZFIVZcWROQTwaG7_v6LA8t1eDMuG_aIA_6IxtlQ/exec";

// 5자리 학번(10101)을 "1학년", "1반", "1번" 데이터와 비교하기 위한 함수
function parseCode(code) {
  let clean = code.replace(/\D/g, "");
  if (clean.length < 5) return null;
  let g = parseInt(clean.slice(0, 1), 10);
  let c = parseInt(clean.slice(1, 3), 10);
  let n = parseInt(clean.slice(3, 5), 10);
  return { g, c, n };
}

document.getElementById("applyForm").onsubmit = async function(e) {
  e.preventDefault();
  const applyMsg = document.getElementById("applyMsg");
  applyMsg.innerHTML = "신청 중입니다...";
  
  const payload = {
    action: "add",
    name: document.getElementById("name").value.trim(),
    grade: document.getElementById("grade").value,
    cls: document.getElementById("cls").value,
    no: document.getElementById("no").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    category: document.getElementById("category").value,
    method: document.getElementById("method").value,
    memo: document.getElementById("memo").value
  };

  try {
    let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
    let data = await res.json();
    if (data.ok) {
      applyMsg.innerHTML = `<div class="msg success">상담 신청이 완료되었습니다.<br>신청번호: <b>${data.id || '완료'}</b></div>`;
      document.getElementById("applyForm").reset();
    } else {
      throw new Error(data.message);
    }
  } catch (err) {
    applyMsg.innerHTML = `<div class="msg error">오류 발생: ${err.message}</div>`;
  }
};

async function checkStatus() {
  const name = document.getElementById("searchName").value.trim();
  const code = document.getElementById("searchCode").value.trim();
  const resultDiv = document.getElementById("statusResult");
  
  if (!name || !code) {
    alert("이름과 학번을 모두 입력해주세요.");
    return;
  }
  
  const parsed = parseCode(code);
  resultDiv.innerHTML = "조회 중...";

  try {
    let res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "list" }) });
    let data = await res.json();
    
    if (!data.ok) throw new Error(data.message);

    // 데이터 필드명 호환 처리 (name 또는 studentName 등)
    let filtered = data.items.filter(x => {
      let xName = (x.name || x.studentName || x.student_name || "").trim();
      if (xName !== name) return false;
      
      if (parsed) {
        let xG = parseInt(String(x.grade || "").replace(/\D/g, ""), 10);
        let xC = parseInt(String(x.cls || x.class || "").replace(/\D/g, ""), 10);
        let xN = parseInt(String(x.no || x.number || "").replace(/\D/g, ""), 10);
        return xG === parsed.g && xC === parsed.c && xN === parsed.n;
      }
      return true;
    });

    if (filtered.length === 0) {
      resultDiv.innerHTML = `<p style="font-size:14px;color:#666">신청 내역이 없습니다.</p>`;
      return;
    }

    resultDiv.innerHTML = filtered.map(x => `
      <div class="item">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <b>${x.date} ${x.time}</b>
          <span class="badge ${x.status==='신청'?'wait':x.status==='승인'?'ok':x.status==='상담 완료'?'done':'cancel'}">${x.status}</span>
        </div>
        <div style="font-size:13px;color:#555">분야: ${x.category} | 방법: ${x.method}</div>
      </div>
    `).join("");

  } catch (err) {
    resultDiv.innerHTML = `<p class="msg error">조회 중 오류가 발생했습니다: ${err.message}</p>`;
  }
}
</script></body></html>
